<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de IMC">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="Lara Santiago">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="title"> CALCULADORA - IMC </div>
            <div class="input">
                <label> Seu nome: </label>
                <input type="text" id="name">
            </div>
            <div class="input">
                <label> Sua altura: </label>
                <input type="number" id="height">
            </div>
            <div class="input">
                <label> Seu peso: </label>
                <input type="number" id="weight">
            </div>
            <button id="calculate"> Calcular</button>
            <div class="result" id="result">   
            </div>
        </div>
    </main>
    <footer>
        <br> <p class="footer"> Projeto desenvolvido por Lara Santiago </p><br> 
        <p class="footer_direitos"> &copy Todos os direitos reservados. </p>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
